# Target-set attention architecture under the archived August 13, 2025 PPO
# cadence. The architecture itself did not exist in the historical campaign.
architecture:
  name: target_set_attention
  hidden_widths: [256, 256]
  activation: relu
  layer_norm: true
  embedding_dim: 128
  attention_heads: 2
  attention_blocks: 1
  feed_forward_width: 128
  dropout: 0.0
  separate_value_network: true

ppo:
  learning_rate: 1.0e-6
  train_batch_size: 180
  minibatch_size: 128
  ppo_epochs: 10
  clip_parameter: 0.15
  entropy_coefficient: 0.0
  value_function_coefficient: 1.0
  gradient_clip: 1.0
  gamma: 0.9997
  gae_lambda: 0.95
  continuous_time_discount: true
  reward_time: step_start
