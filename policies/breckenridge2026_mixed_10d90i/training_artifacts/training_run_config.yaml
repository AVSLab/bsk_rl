cli_args:
  checkpoint_frequency: 5
  checkpoints_to_keep: 3
  downlink_bonus: 0.1
  failure_penalty: -10.0
  leave_cores: 4
  low_battery_penalty: -0.5
  mix_weights: LEO=0.5,MEO=0.3,GEO=0.2
  n_envs: null
  output_root: ~/rllib_results/breckenridge2026_leo_any_oldnet
  reload_frequency: 500000
  run_prefix: breckenridge2026_LEOAny_oldnet_local
  smoke_test: false
  temp_dir: null
  torch_threads: 3
  total_timesteps: 20000000
  train_batch_size: 4992
job_args:
