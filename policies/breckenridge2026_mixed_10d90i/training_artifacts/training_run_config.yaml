        - !!python/object:bsk_rl.act.discrete_actions.ImageRSO
          chosen_target_alt_km: []
          chosen_target_azimuth: []
          chosen_target_distance: []
          chosen_target_elevation_angle: []
          chosen_target_elevation_local: []
          chosen_target_ids: []
          chosen_target_illumination_status: []
          chosen_target_orbit_regime: []
          chosen_target_priority: []
          chosen_target_rel_direction: []
          chosen_target_rel_pos_H: []
          duration: 300.0
          ever_visible: []
          imaging_times: []
          initial_angular_error: []
          n_actions: 10
          name: action_imageRSO
          satellite: *id001
          scanner_shadowFactor: []
          sun_azimuth: []
          sun_elevation_local: []
          sun_target_daz_deg: []
          sun_target_dot: []
          sun_target_sep_deg: []
          umbra_imaging_decisions: 0
          umbra_regular_decisions: 0
          umbra_smart_decisions: 0
          umbra_smart_reason_counts:
            high_regime: 0
            illum_target: 0
            sunward_leo: 0
        - !!python/object:bsk_rl.act.discrete_actions.Charge
          duration: 300.0
          fsw_action: action_charge
          n_actions: 1
          name: action_charge
          reset_task: false
          satellite: *id001
        - !!python/object:bsk_rl.act.discrete_actions.Downlink
          duration: 300.0
          fsw_action: action_downlink
          n_actions: 1
          name: action_downlink
          reset_task: false
          satellite: *id001
        - !!python/object:bsk_rl.act.discrete_actions.Desat
          duration: 150.0
